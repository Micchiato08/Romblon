  <style>
body{
  background-color: antiquewhite;
}

.gallery{
  width: 100%;
}
.gallery img {
  width: 250px;
  height: 700px;
  object-fit: cover;
  border-radius: 200px;
  border: 4px solid rgb(245, 222, 179);
  transition: transform 0.3s, box-shadow 0.3s;
  margin-right: 32px}

.gallery img:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
}

 img {
      width: 200px;
      height: auto;
      align-items: center;
      border-radius: 10px;
      width: 350px;
      height: 350px;
      object-fit: cover;
      border-radius: 10px;
      border: 4px solid wheat;

        transform 0.3s,

    }
     header {
        display: flex;

        align-items: center;

      }

        font-size: 1.5rem;
        font-weight: bold;
        color: #fff;
      }
      
      nav {
        display: flex;
        gap: 20px;
      }
      nav a {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 4px;
        transition:
          background-color 0.3s,
          color 0.3s;
      }

      nav a:hover {
        background-color: rgba(255, 255, 255, 0.2);

        color: #fff;
      }

        color: #263e4b;
